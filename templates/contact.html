<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me contacter</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: #818cf8;
            --text-title: #ffffff;
            --text-body: #9ca3af;
            --text-label: #f3f4f6;
            --primary-glow: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-main);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* --- EFFETS DE LUMIÈRE D'ARRIÈRE-PLAN (NEON GLOW) --- */
        .glow-ambient {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            opacity: 0.35;
            pointer-events: none;
        }
        .glow-1 {
            top: -10%;
            left: 20%;
            width: 500px;
            height: 500px;
            background: #4f46e5;
        }
        .glow-2 {
            bottom: -10%;
            right: 20%;
            width: 600px;
            height: 600px;
            background: #7c3aed;
        }

        /* --- CARTE DE CONTACT (DARK GLASSMORPHISM) --- */
        .contact-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            padding: 48px;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- EN-TÊTE --- */
        .contact-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .contact-header h1 {
            font-size: 2.25rem;
            color: var(--text-title);
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contact-header p {
            color: var(--text-body);
            font-size: 1rem;
            line-height: 1.5;
        }

        /* --- FORMULAIRE --- */
        .form-group {
            margin-bottom: 28px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-label);
            margin-bottom: 10px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            font-size: 1rem;
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        /* Effets d'interaction sur les champs */
        input[type="text"]:hover,
        textarea:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        input[type="text"]:focus,
        textarea:focus {
            background: rgba(255, 255, 255, 0.02);
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15),
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        /* --- BOUTON ENVOYER GLOW --- */
        .btn-container {
            position: relative;
            margin-top: 12px;
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: var(--primary-glow);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.5);
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 580px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .contact-card {
                padding: 32px 24px;
            }
            .contact-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Effets de lumières d'ambiance sombres -->
    <div class="glow-ambient glow-1"></div>
    <div class="glow-ambient glow-2"></div>

    <!-- Carte de contact principale -->
    <div class="contact-card">
        <div class="contact-header">
            <h1>Entrons en contact</h1>
            <p>Laissez-nous un message. Notre équipe revient vers vous dans les plus brefs délais.</p>
        </div>

        <!-- Formulaire de contact simulé -->
        <form onsubmit="event.preventDefault(); alert('Message envoyé (Simulation complète).');">
            
            <!-- Nom & Prénom sur une seule ligne -->
            <div class="form-row">
                <div class="form-group">
                    <label for="lastname">Nom</label>
                    <input type="text" id="lastname" placeholder="Ex: Wayne" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="firstname">Prénom</label>
                    <input type="text" id="firstname" placeholder="Ex: Bruce" required autocomplete="off">
                </div>
            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="message">Votre message</label>
                <textarea id="message" placeholder="Décrivez votre besoin en quelques lignes..." required></textarea>
            </div>

            <!-- Bouton avec conteneur pour l'effet d'ombre portée -->
            <div class="btn-container">
                <button type="submit" class="btn-submit">Envoyer le message</button>
            </div>
        </form>
    </div>

</body>
</html>
