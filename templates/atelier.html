<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelier Météo — Jauge Vent Multi-Villes</title>

  <!-- Chargement de la bibliothèque Google Charts -->
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body { 
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; 
      margin: 0; 
      padding: 40px 24px;
      background-color: #0f172a; /* Fond sombre moderne */
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }
    p.subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Style du sélecteur de ville */
    .select-container {
      margin-bottom: 32px;
    }
    select {
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 12px;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    /* Conteneur centré pour la jauge */
    #chart_wrap {
      background: rgba(30, 41, 59, 0.7);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 300px;
      height: 300px;
    }
    #status { 
      margin-top: 32px; 
      font-size: 0.9rem;
      color: #38bdf8; 
      background: rgba(56, 189, 248, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.3s ease;
    }
  </style>
</head>

<body>

  <!-- Le nom de la ville s'adaptera tout seul grâce au Javascript -->
  <h1 id="main-title">Indicateur de Vent — Marseille</h1>
  <p class="subtitle">Données lues depuis Open Météo</p>

  <!-- Menu déroulant pour le choix des 5 villes -->
  <div class="select-container">
    <select id="ville-selector">
      <option value="marseille" selected>Marseille</option>
      <option value="rennes">Rennes</option>
      <option value="paris">Paris</option>
      <option value="toulouse">Toulouse</option>
      <option value="bordeaux">Bordeaux</option>
    </select>
  </div>

  <div id="chart_wrap">
    <div id="chart"></div>
  </div>

  <div id="status">Connexion au serveur local...</div>

  <script>
    google.charts.load('current', { packages: ['gauge'] });
    google.charts.setOnLoadCallback(init);

    // Étape 1 : Initialisation au premier chargement
    async function init() {
      const selector = document.getElementById('ville-selector');
      
      // On charge la ville sélectionnée par défaut (Marseille)
      await updateDashboard(selector.value);

      // Écouteur d'événement : Dès que l'utilisateur choisit une autre ville
      selector.addEventListener('change', async (event) => {
        await updateDashboard(event.target.value);
      });
    }

    // Fonction globale pour orchestrer la mise à jour de l'affichage
    async function updateDashboard(nomVille) {
      try {
        showStatus("Récupération des données...");
        
        // Appelle ton API locale Flask avec la ville en paramètre
        const windSpeed = await fetchWindData(nomVille);
        
        // Met à jour le graphique
        drawGauge(windSpeed);
        
        // Met à jour dynamiquement le titre de la page (première lettre en majuscule)
        const nomFormate = nomVille.charAt(0).toUpperCase() + nomVille.slice(1);
        document.getElementById('main-title').textContent = `Indicateur de Vent — ${nomFormate}`;
        
        // Message de succès personnalisé
        showStatus(`Mise à jour effectuée : ${windSpeed} km/h mesurés à ${nomFormate}.`);
      } catch (err) {
        document.getElementById('status').style.color = '#ef4444';
        document.getElementById('status').style.background = 'rgba(239, 68, 68, 0.1)';
        showStatus("Erreur : " + err.message);
      }
    }

    // Étape 2 : Fetch relié à ta route Flask
    async function fetchWindData(nomVille) {
      const res = await fetch(`/openmeteo?ville=${nomVille}`, { headers: { 'Accept': 'application/json' } });
      
      if (!res.ok) throw new Error(`Erreur HTTP ${res.status}`);
      
      const data = await res.json();
      return Number(data.wind_speed); 
    }

    // Étape 3 : Configuration de la Jauge
    function drawGauge(windSpeed) {
      const data = google.visualization.arrayToDataTable([
        ['Label', 'Value'],
        ['Vent (km/h)', windSpeed]
      ]);

      const options = {
        width: 260, 
        height: 260,
        min: 0,
        max: 100,
        greenFrom: 0, greenTo: 25,
        yellowFrom: 25, yellowTo: 55,
        redFrom: 55, redTo: 100,
        minorTicks: 5
      };

      const chart = new google.visualization.Gauge(document.getElementById('chart'));
      chart.draw(data, options);
    }

    function showStatus(msg) {
      document.getElementById('status').textContent = msg;
    }
  </script>
</body>
</html>
